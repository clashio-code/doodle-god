          /* ---------- tanda tangan APK (PackageInfo.signatures) ----------
           * Native cek lisensi memanggil getPackageInfo(pkg, GET_SIGNATURES).signatures[0].hashCode(). Java asli: Signature.hashCode() =
           * Arrays.hashCode(byte[] sertifikat DER). Sertifikat diambil dari META-INF (berkas .RSA/.DSA/.EC) di APK (PKCS7: cari "a0 82 LL LL 30 82 LL LL 30 82"). */
          static int g_sig_hash, g_sig_ready;
          static void *g_sig_arr;
          static void sig_init(void) {
            int i;
            if (g_sig_ready) return;
            g_sig_ready = 1;
            for (i = 0; i < g_nents && !g_sig_hash; i++) {
              const char *nm = g_ents[i].name;
              size_t nl = strlen(nm);
              long len = 0, k;
              unsigned char *b;
              if (strncmp(nm, "META-INF/", 9) != 0 || nl < 13) continue;
              if (strcmp(nm + nl - 4, ".RSA") && strcmp(nm + nl - 4, ".DSA") && strcmp(nm + nl - 3, ".EC")) continue;
              b = apk_read(&g_ents[i], &len);
              if (!b) continue;
              for (k = 0; k + 10 < len; k++) {
                if (b[k] == 0xa0 && b[k + 1] == 0x82 && b[k + 4] == 0x30 && b[k + 5] == 0x82 && b[k + 8] == 0x30 && b[k + 9] == 0x82) {
                  long cl = 4 + (long)(((unsigned)b[k + 6] << 8) | b[k + 7]), j;
                  uint32_t h = 0;
                  if (k + 4 + cl > len) continue;
                  for (j = 0; j < cl; j++) h = 31u * h + (uint32_t)(int32_t)(int8_t)b[k + 4 + j];
                  g_sig_hash = (int32_t)h;
                  L("[sig] sertifikat dari %s (%ld byte) -> hashCode=%d\n", nm, cl, g_sig_hash);
                  break;
                }
              }
              free(b);
            }
            if (!g_sig_hash) L("[sig] PERINGATAN: sertifikat APK tidak ketemu di META-INF (APK mungkin hanya v2/v3), hashCode=0\n");
            g_sig_arr = mk_array(8, 1);
            if (g_sig_arr) ((void **)arr_get(g_sig_arr)->data)[0] = mk_obj("android/content/pm/Signature");
          }


