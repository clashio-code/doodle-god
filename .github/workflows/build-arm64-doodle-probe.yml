          static unsigned png_crc(unsigned c, const unsigned char *p, size_t n) {
            static unsigned tab[256];
            static int init;
            size_t i;
            if (!init) { unsigned k, j; for (k = 0; k < 256; k++) { unsigned v = k; for (j = 0; j < 8; j++) v = (v & 1) ? 0xedb88320u ^ (v >> 1) : v >> 1; tab[k] = v; } init = 1; }
            c = ~c;
            for (i = 0; i < n; i++) c = tab[(c ^ p[i]) & 255] ^ (c >> 8);
            return ~c;
          }
          static void png_put32(unsigned char *o, unsigned v) { o[0] = (unsigned char)(v >> 24); o[1] = (unsigned char)(v >> 16); o[2] = (unsigned char)(v >> 8); o[3] = (unsigned char)v; }
          static void png_chunk(FILE *f, const char *type, const unsigned char *d, unsigned n) {
            unsigned char hd[8], cr[4];
            unsigned c;
            png_put32(hd, n); memcpy(hd + 4, type, 4);
            fwrite(hd, 1, 8, f);
            if (n) fwrite(d, 1, n, f);
            c = png_crc(0, (const unsigned char *)type, 4);
            if (n) c = png_crc(c, d, n);
            png_put32(cr, c); fwrite(cr, 1, 4, f);
          }
          /* PNG tanpa kompresi (blok deflate "stored"); rgba = piksel dari glReadPixels (baris paling bawah dulu) */
          static int png_write(const char *path, const unsigned char *rgba, int w, int h) {
            size_t rawn = (size_t)h * (1 + (size_t)w * 3), nblk = (rawn + 65534) / 65535, zn = 2 + nblk * 5 + rawn + 4, pos = 0, o = 0, y;
            unsigned char *raw = malloc(rawn), *z = malloc(zn), ihdr[13];
            unsigned a = 1, b = 0;
            FILE *f;
            if (!raw || !z) { free(raw); free(z); return -1; }
            for (y = 0; y < (size_t)h; y++) {
              const unsigned char *s = rgba + (size_t)(h - 1 - (int)y) * (size_t)w * 4;
              int x;
              raw[pos++] = 0;
              for (x = 0; x < w; x++) { raw[pos++] = s[x * 4]; raw[pos++] = s[x * 4 + 1]; raw[pos++] = s[x * 4 + 2]; }
            }
            for (pos = 0; pos < rawn; pos++) { a = (a + raw[pos]) % 65521u; b = (b + a) % 65521u; }
            z[o++] = 0x78; z[o++] = 0x01;
            for (pos = 0; pos < rawn; ) {
              size_t n = rawn - pos > 65535 ? 65535 : rawn - pos;
              z[o++] = (pos + n >= rawn) ? 1 : 0;
              z[o++] = (unsigned char)(n & 255); z[o++] = (unsigned char)(n >> 8);
              z[o++] = (unsigned char)(~n & 255); z[o++] = (unsigned char)((~n >> 8) & 255);
              memcpy(z + o, raw + pos, n); o += n; pos += n;
            }
            png_put32(z + o, (b << 16) | a); o += 4;
            png_put32(ihdr, (unsigned)w); png_put32(ihdr + 4, (unsigned)h);
            ihdr[8] = 8; ihdr[9] = 2; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
            f = fopen(path, "wb");
            if (!f) { free(raw); free(z); return -1; }
            fwrite("\x89PNG\r\n\x1a\n", 1, 8, f);
            png_chunk(f, "IHDR", ihdr, 13); png_chunk(f, "IDAT", z, (unsigned)o); png_chunk(f, "IEND", NULL, 0);
            fclose(f); free(raw); free(z);
            return 0;
          }
