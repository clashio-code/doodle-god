          /* ======================= kanari stack TLS =======================
           * Kode Android arm64 membaca kanari stack dari [tpidr_el0 + 40] (TLS slot 5 bionic). Di glibc slot itu berisi data lain
           * yang bisa berubah -> "stack smashing" palsu. Solusi: blok TLS executable ini (modul TLS pertama, mulai tp+16)
           * diisi konstanta yang sama di semua kata, dan gambar awal .tdata disalin ke SETIAP thread baru. */
          #define C8 0x5ad0c0de1badc0deULL
          static __thread uint64_t g_tls_guard[16] __attribute__((aligned(16), used)) = { C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8 };

          static int tls_guard_check(void) {
          #if defined(__aarch64__)
            uint64_t tp, v;
            __asm__ volatile("mrs %0, tpidr_el0" : "=r"(tp));
            v = *(volatile uint64_t *)(tp + 40);
            L("[tls] kanari di tp+40 = 0x%llx (harus 0x%llx) | blok TLS kita mulai di tp+%lld -> %s\n", (unsigned long long)v, (unsigned long long)C8,
              (long long)((uintptr_t)&g_tls_guard[0] - (uintptr_t)tp), v == C8 ? "OK" : "TIDAK COCOK");
            return v == C8 ? 0 : -1;
          #else
            (void)g_tls_guard;
            L("[tls] (bukan aarch64: pengecekan kanari dilewati)\n");
            return 0;
          #endif
          }

          /* ======================= diagnostik crash ======================= */
          static const char *game_sym(const Mod *m, uintptr_t a, uint64_t *delta) {
            uint64_t off = (uint64_t)(a - m->bias), best = 0; const char *nm = NULL; int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *y = &m->sym[i];
              if (y->st_shndx == SHN_UNDEF || !y->st_name || ELF64_ST_TYPE(y->st_info) != STT_FUNC) continue;
              if (y->st_value <= off && y->st_value >= best) { best = y->st_value; nm = m->str + y->st_name; }
            }
            *delta = off - best;
            return nm;
          }
          static void describe(uintptr_t a) {
            int i;
            for (i = 0; i < nmods; i++)
              if (a >= (uintptr_t)mods[i].base && a < (uintptr_t)mods[i].base + mods[i].span) {
                uint64_t d = 0; const char *nm = game_sym(&mods[i], a, &d);
                L("    -> %s + 0x%llx  [%s+0x%llx]\n", mods[i].name, (unsigned long long)(a - mods[i].bias), nm ? nm : "?", (unsigned long long)d);
              }
          }
          static void map_of(const char *tag, uintptr_t a) {
            FILE *m = fopen("/proc/self/maps", "r");
            char ln[512];
            if (!m) return;
            while (fgets(ln, sizeof ln, m)) {
              unsigned long lo = 0, hi = 0;
              const char *q = ln;
              /* parse hex manual: sscanf/strtoul di glibc build >=2.38 terikat ke simbol GLIBC_2.38 */
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) lo = lo * 16 + (unsigned long)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (*q == '-') q++;
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) hi = hi * 16 + (unsigned long)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (hi && a >= lo && a < hi) {
                char *nl = strchr(ln, '\n'); if (nl) *nl = 0;
                L("    %s in map: %s\n", tag, ln);
                break;
              }
            }
            fclose(m);
          }
          /* kandidat return address di modul game, dipindai dari sp ke atas sampai ujung peta stack (maks maxwords kata).
           * Berguna saat abort karena exception C++ tak tertangkap: frame pelempar masih ada di stack (belum di-unwind). */
          static void stack_candidates(uintptr_t sp, int maxwords, int maxshow, const char *tag) {
            uintptr_t end = sp + (uintptr_t)maxwords * 8, lo, hi;
            const uintptr_t *s = (const uintptr_t *)sp;
            int k, shown = 0;
            FILE *m = fopen("/proc/self/maps", "r");
            char ln[512];
            if (m) {
              while (fgets(ln, sizeof ln, m)) {
                const char *q = ln;
                lo = 0; hi = 0;
                while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) lo = lo * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
                if (*q == '-') q++;
                while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) hi = hi * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
                if (sp >= lo && sp < hi) { if (hi < end) end = hi; break; }
              }
              fclose(m);
            }
            L("  [stack%s] pindai sp=%p .. %p (%ld kata) untuk return address di modul game:\n", tag, (void *)sp, (void *)end, (long)((end - sp) / 8));
            for (k = 0; sp + (uintptr_t)k * 8 + 8 <= end && shown < maxshow; k++) {
              int i;
              for (i = 0; i < nmods; i++)
                if (s[k] >= (uintptr_t)mods[i].base && s[k] < (uintptr_t)mods[i].base + mods[i].span) {
                  uint64_t d = 0; const char *nm = game_sym(&mods[i], s[k], &d);
                  L("    sp+%d: %s + 0x%llx  [%s+0x%llx]\n", k * 8, mods[i].name, (unsigned long long)(s[k] - mods[i].bias), nm ? nm : "?", (unsigned long long)d);
                  shown++; break;
                }
            }
            if (!shown) L("    (tidak ada)\n");
          }
          static volatile int g_in_sig;
          static void on_sig(int sig, siginfo_t *si, void *ctx) {
            ucontext_t *uc = (ucontext_t *)ctx;
            if (g_in_sig++) _exit(128 + sig);   /* crash di dalam handler (mis. heap rusak): jangan berulang/menggantung */
            uintptr_t pc = 0, lr = 0, sp = 0;
            (void)uc; (void)sp; (void)lr;
          #if defined(__aarch64__)
            pc = (uintptr_t)uc->uc_mcontext.pc; lr = (uintptr_t)uc->uc_mcontext.regs[30]; sp = (uintptr_t)uc->uc_mcontext.sp;
          #endif
            L("\n*** SINYAL %d  addr=%p  pc=%p  lr=%p ***\n", sig, si->si_addr, (void *)pc, (void *)lr);
            describe(pc); describe(lr);
            map_of("pc", pc); map_of("lr", lr);
          #if defined(__aarch64__)
            {
              int k;
              for (k = 0; k < 30; k += 4)
                L("    x%-2d=%016llx x%-2d=%016llx x%-2d=%016llx x%-2d=%016llx\n", k, (unsigned long long)uc->uc_mcontext.regs[k], k + 1, (unsigned long long)uc->uc_mcontext.regs[k + 1],
                  k + 2, (unsigned long long)uc->uc_mcontext.regs[k + 2], k + 3 < 30 ? k + 3 : 29, (unsigned long long)uc->uc_mcontext.regs[k + 3 < 30 ? k + 3 : 29]);
              L("    sp=%016llx\n", (unsigned long long)sp);
              if (pc > 64) {  /* kata instruksi di sekitar pc untuk disassembly offline */
                const uint32_t *c = (const uint32_t *)((pc & ~(uintptr_t)3) - 48);
                L("  [code] 12 kata sebelum pc + pc + 3 sesudah (mulai %p):", (const void *)c);
                for (k = 0; k < 16; k++) { if (k % 4 == 0) L("\n   "); L(" %08x", c[k]); }
                L("\n");
              }
              stack_candidates(sp, 24576, 80, "");
            }
          #endif
            _exit(128 + sig);
          }
          static void on_alarm(int sig) { (void)sig; L("\n*** WATCHDOG: waktu habis, proses dihentikan ***\n"); _exit(4); }

          /* ======================= shim bionic -> glibc ======================= */
          /* bionic LP64: sizeof(FILE)=152; __sF = array 3 FILE (stdin, stdout, stderr). Kode lama memakai &__sF[n] -> petakan ke stdio glibc. */
          #define BSF 152
          static char bionic_sF[3 * BSF];
          static FILE *xf(FILE *f) {
            uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF;
            if (a >= b && a < b + sizeof bionic_sF) { unsigned i = (unsigned)((a - b) / BSF); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return f;
          }
          static int b_fprintf(FILE *f, const char *fmt, ...) { va_list ap; int r; va_start(ap, fmt); r = vfprintf(xf(f), fmt, ap); va_end(ap); return r; }
          static int b_fputs(const char *s, FILE *f) { return fputs(s, xf(f)); }
          static int b_fputc(int c, FILE *f) { return fputc(c, xf(f)); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, FILE *f) { return fwrite(p, s, n, xf(f)); }
          static int b_fflush(FILE *f) { return fflush(xf(f)); }

          /* fortify bionic. CATATAN: __fread_chk glibc urutan argumennya BEDA (ptr,ptrlen,size,n,stream) -> wajib shim. */
          static size_t b_strlen_chk(const char *s, size_t n) { size_t l = strlen(s); if (l >= n) { L("*** __strlen_chk: overflow\n"); abort(); } return l; }
          static char *b_strncpy_chk2(char *d, const char *s, size_t n, size_t dl, size_t sl) { (void)sl; if (n > dl) { L("*** __strncpy_chk2: overflow\n"); abort(); } return strncpy(d, s, n); }
          static size_t b_fwrite_chk(const void *p, size_t s, size_t n, FILE *f, size_t bs) { if (s && n > bs / s) { L("*** __fwrite_chk: overflow\n"); abort(); } return fwrite(p, s, n, xf(f)); }
          static size_t b_fread_chk(void *p, size_t s, size_t n, FILE *f, size_t bs) { if (s && n > bs / s) { L("*** __fread_chk: overflow\n"); abort(); } return fread(p, s, n, xf(f)); }

          static int *b_errno(void) { return &errno; }
          static int g_droid_n;
          static int b_android_log_write(int prio, const char *tag, const char *text) {
            if (g_droid_n++ < 4000) L("[droid %d/%s] %s%s", prio, tag ? tag : "?", text ? text : "", (text && text[0] && text[strlen(text) - 1] == '\n') ? "" : "\n");
            return 1;
          }
          static int b_android_log_vprint(int prio, const char *tag, const char *fmt, va_list ap) {
            char buf[1024]; vsnprintf(buf, sizeof buf, fmt ? fmt : "", ap);
            return b_android_log_write(prio, tag, buf);
          }
          static int b_android_log_print(int prio, const char *tag, const char *fmt, ...) {
            va_list ap; int r; va_start(ap, fmt); r = b_android_log_vprint(prio, tag, fmt, ap); va_end(ap); return r;
          }
          static void b_assert2(const char *file, int line, const char *func, const char *msg) {
            L("\n*** ASSERT bionic: %s:%d (%s): %s ***\n", file, line, func, msg);
            abort();
          }
          static void b_set_abort_message(const char *msg) {
            L("[droid] android_set_abort_message: %s\n", msg ? msg : "(null)");
            if (msg && strstr(msg, "uncaught exception")) stack_candidates((uintptr_t)__builtin_frame_address(0), 24576, 80, " abort");
          }
          static int b_system_property_get(const char *name, char *value) {
            static int n;
            const char *v = "";
            if (name && !strcmp(name, "ro.build.version.sdk")) v = "30";
            else if (name && !strcmp(name, "ro.build.version.release")) v = "11";
            else if (name && !strcmp(name, "ro.product.model")) v = "muOS";
            if (n++ < 20) L("[droid] __system_property_get(\"%s\") -> \"%s\"\n", name ? name : "?", v);
            if (value) strcpy(value, v);
            return (int)strlen(v);
          }
          extern int __xpg_strerror_r(int, char *, size_t);
          static int b_strerror_r(int e, char *buf, size_t n) { return __xpg_strerror_r(e, buf, n); }  /* bionic = versi XSI (int) */

          /* --- APK (zip) + AAssetManager palsu: aset dibaca langsung dari doodlegod.apk, inflate lewat libz.so.1 (dlopen) --- */
          typedef struct { unsigned char *next_in; unsigned avail_in; unsigned long total_in; unsigned char *next_out; unsigned avail_out; unsigned long total_out;
            char *msg; void *state; void *zalloc, *zfree, *opaque; int data_type; unsigned long adler, reserved; } zs_t;   /* z_stream LP64 = 112 byte */
          static int (*p_inflateInit2_)(zs_t *, int, const char *, int);
          static int (*p_inflate)(zs_t *, int);
          static int (*p_inflateEnd)(zs_t *);
          static const char *(*p_zlibVersion)(void);
          static unsigned long (*p_crc32)(unsigned long, const unsigned char *, unsigned);
          typedef struct { char *name; uint32_t method, csize, usize, loff, crc; } ZEnt;
          static ZEnt *g_ents;
          static int g_nents, g_apkfd = -1;
          static int g_asset_ok, g_asset_miss;

          static uint32_t rd32(const unsigned char *p) { return (uint32_t)p[0] | ((uint32_t)p[1] << 8) | ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24); }
          static uint32_t rd16(const unsigned char *p) { return (uint32_t)p[0] | ((uint32_t)p[1] << 8); }

          static int zlib_load(void) {
            void *h = dlopen("libz.so.1", RTLD_NOW | RTLD_GLOBAL);
            if (!h) h = dlopen("/usr/lib/libz.so.1", RTLD_NOW | RTLD_GLOBAL);
            if (!h) { L("[apk] libz.so.1 tidak bisa dimuat\n"); return -1; }
            *(void **)&p_inflateInit2_ = dlsym(h, "inflateInit2_"); *(void **)&p_inflate = dlsym(h, "inflate");
            *(void **)&p_inflateEnd = dlsym(h, "inflateEnd"); *(void **)&p_zlibVersion = dlsym(h, "zlibVersion"); *(void **)&p_crc32 = dlsym(h, "crc32");
            if (!p_inflateInit2_ || !p_inflate || !p_inflateEnd || !p_zlibVersion) { L("[apk] simbol zlib tidak lengkap\n"); return -1; }
            return 0;
          }

          static int apk_open(const char *path) {
            if (g_nents > 0) return 0;    /* sudah terbuka (idempoten: mencegah penulisan melewati array g_ents) */
            struct stat st;
            unsigned char *tail, *cd;
            size_t tl, cdsize, k;
            long p;
            uint32_t cdoff;
            int i, n;
            g_apkfd = open(path, O_RDONLY);
            if (g_apkfd < 0) { L("[apk] gagal membuka %s: %s\n", path, strerror(errno)); return -1; }
            if (fstat(g_apkfd, &st) != 0) return -1;
            tl = (size_t)st.st_size < 70000 ? (size_t)st.st_size : 70000;
            tail = malloc(tl);
            if (!tail || pread(g_apkfd, tail, tl, st.st_size - (off_t)tl) != (ssize_t)tl) { L("[apk] gagal membaca ujung file\n"); return -1; }
            for (p = (long)tl - 22; p >= 0; p--) if (rd32(tail + p) == 0x06054b50u) break;
            if (p < 0) { L("[apk] EOCD zip tidak ditemukan\n"); return -1; }
            n = (int)rd16(tail + p + 10); cdsize = rd32(tail + p + 12); cdoff = rd32(tail + p + 16);
            free(tail);
            cd = malloc(cdsize);
            if (!cd || pread(g_apkfd, cd, cdsize, cdoff) != (ssize_t)cdsize) { L("[apk] gagal membaca central directory\n"); return -1; }
            g_ents = calloc((size_t)n, sizeof(ZEnt));
            for (i = 0, k = 0; i < n && k + 46 <= cdsize; i++) {
              uint32_t nl, el, cl;
              if (rd32(cd + k) != 0x02014b50u) break;
              nl = rd16(cd + k + 28); el = rd16(cd + k + 30); cl = rd16(cd + k + 32);
              g_ents[g_nents].method = rd16(cd + k + 10); g_ents[g_nents].csize = rd32(cd + k + 20);
              g_ents[g_nents].usize = rd32(cd + k + 24); g_ents[g_nents].loff = rd32(cd + k + 42); g_ents[g_nents].crc = rd32(cd + k + 16);
              g_ents[g_nents].name = malloc(nl + 1); memcpy(g_ents[g_nents].name, cd + k + 46, nl); g_ents[g_nents].name[nl] = 0;
              g_nents++; k += 46 + nl + el + cl;
            }
            free(cd);
            L("[apk] %s: %d entri, ukuran %lld byte\n", path, g_nents, (long long)st.st_size);
            return g_nents > 0 ? 0 : -1;
          }
          static ZEnt *apk_find(const char *name) { int i; for (i = 0; i < g_nents; i++) if (strcmp(g_ents[i].name, name) == 0) return &g_ents[i]; return NULL; }

          /* baca satu entri penuh ke memori; mengembalikan buffer malloc (ada +1 byte NUL) atau NULL */
          static unsigned char *apk_read(const ZEnt *e, long *outlen) {
            unsigned char hdr[30], *raw, *out;
            off_t doff;
            if (pread(g_apkfd, hdr, 30, e->loff) != 30 || rd32(hdr) != 0x04034b50u) return NULL;
            doff = (off_t)e->loff + 30 + (off_t)rd16(hdr + 26) + (off_t)rd16(hdr + 28);
            out = malloc((size_t)e->usize + 1);
            if (!out) return NULL;
            if (e->method == 0) {
              if (pread(g_apkfd, out, e->usize, doff) != (ssize_t)e->usize) { free(out); return NULL; }
            } else if (e->method == 8) {
              zs_t z;
              int r;
              raw = malloc(e->csize ? e->csize : 1);
              if (!raw || pread(g_apkfd, raw, e->csize, doff) != (ssize_t)e->csize) { free(raw); free(out); return NULL; }
              memset(&z, 0, sizeof z);
              z.next_in = raw; z.avail_in = e->csize; z.next_out = out; z.avail_out = e->usize;
              if (p_inflateInit2_(&z, -15, p_zlibVersion(), (int)sizeof z) != 0) { free(raw); free(out); return NULL; }
              r = p_inflate(&z, 4 /* Z_FINISH */);
              p_inflateEnd(&z); free(raw);
              if (r != 1 /* Z_STREAM_END */) { free(out); return NULL; }
            } else { free(out); return NULL; }
            out[e->usize] = 0;
            *outlen = (long)e->usize;
            return out;
          }

          typedef struct { unsigned char *buf; long len, pos; } Asset;
          static char g_amgr_token[8];
          static void *b_AAssetManager_fromJava(void *env, void *obj) { (void)env; (void)obj; return g_amgr_token; }
          static void *b_AAssetManager_open(void *m, const char *fn, int mode) {
            const char *q = fn ? fn : "";
            char full[700];
            ZEnt *e;
            Asset *a;
            long n = 0;
            unsigned char *buf;
            (void)m; (void)mode;
            while (*q == '/') q++;
            snprintf(full, sizeof full, "assets/%s", q);
            e = apk_find(full);
            if (!e) { if (g_asset_miss++ < 300) L("[asset] open(\"%s\") -> TIDAK ADA di APK\n", q); return NULL; }
            buf = apk_read(e, &n);
            if (!buf) { L("[asset] open(\"%s\") -> GAGAL dibaca/inflate\n", q); return NULL; }
            a = malloc(sizeof *a); a->buf = buf; a->len = n; a->pos = 0;
            if (g_asset_ok++ < 400) L("[asset] open(\"%s\") -> %ld byte\n", q, n);
            return a;
          }
          static long b_AAsset_getLength(void *h) { return ((Asset *)h)->len; }
          static long b_AAsset_getRemainingLength(void *h) { Asset *a = h; return a->len - a->pos; }
          static int b_AAsset_read(void *h, void *buf, size_t n) {
            Asset *a = h; long rem = a->len - a->pos;
            if (rem <= 0) return 0;
            if ((long)n > rem) n = (size_t)rem;
            memcpy(buf, a->buf + a->pos, n); a->pos += (long)n;
            return (int)n;
          }
          static long b_AAsset_seek(void *h, long off, int whence) {
            Asset *a = h; long np = whence == 0 ? off : whence == 1 ? a->pos + off : a->len + off;
            if (np < 0 || np > a->len) return -1;
            a->pos = np; return np;
          }
          static const void *b_AAsset_getBuffer(void *h) { return ((Asset *)h)->buf; }
          static void b_AAsset_close(void *h) { Asset *a = h; if (a) { free(a->buf); free(a); } }

          /* --- dl_iterate_phdr: unwinder C++ (statis di libc++_shared) memakai ini untuk mencari .eh_frame. Modul yang kita muat
           *     sendiri TIDAK terlihat oleh glibc, jadi laporkan sendiri lalu lanjut ke daftar glibc. --- */
          static int b_dl_iterate_phdr(int (*cb)(struct dl_phdr_info *, size_t, void *), void *data) {
            int i, r;
            for (i = 0; i < nmods; i++) {
              const Elf64_Ehdr *eh = (const Elf64_Ehdr *)mods[i].file;
              struct dl_phdr_info info;
              memset(&info, 0, sizeof info);
              info.dlpi_addr = (ElfW(Addr))mods[i].bias;
              info.dlpi_name = mods[i].name;
              info.dlpi_phdr = (const ElfW(Phdr) *)(mods[i].file + eh->e_phoff);
              info.dlpi_phnum = eh->e_phnum;
              info.dlpi_adds = (unsigned long long)nmods;
              r = cb(&info, sizeof info, data);
              if (r) return r;
            }
            return dl_iterate_phdr(cb, data);
          }

          /* ---------- penskalaan layar ----------
           * APK hanya membawa aset 1366x768 (assets/aspect/1366x768, assets/resolution/1366x768), sedangkan layar device 640x480.
           * Game dibohongi: surfaceChanged(1366,768). glViewport/glScissor dari game diskalakan ke jendela asli (letterbox/stretch),
           * sentuhan/kursor dipetakan balik ke koordinat game. Matikan dengan --size 0x0. */
          static int g_gw = 1366, g_gh = 768;      /* ukuran yang dilaporkan ke game; 0 = ukuran asli */
          static int g_ww = 640, g_wh = 480;       /* ukuran jendela asli */
          static int g_fit_stretch;
          static float g_gs_x = 1.f, g_gs_y = 1.f;
          static int g_gox, g_goy;
          static void (*r_glViewport)(int, int, int, int);
          static void (*r_glScissor)(int, int, int, int);
          static void gs_setup(void) {
            float sx = (float)g_ww / (float)g_gw, sy = (float)g_wh / (float)g_gh;
            if (g_fit_stretch) { g_gs_x = sx; g_gs_y = sy; g_gox = 0; g_goy = 0; }
            else {
              float k = sx < sy ? sx : sy;
              g_gs_x = k; g_gs_y = k;
              g_gox = (int)(((float)g_ww - (float)g_gw * k) / 2.f);
              g_goy = (int)(((float)g_wh - (float)g_gh * k) / 2.f);
            }
          }
          static void b_glViewport(int x, int y, int w, int h) {
            if (!r_glViewport) *(void **)&r_glViewport = h_gles ? dlsym(h_gles, "glViewport") : NULL;
            if (r_glViewport) r_glViewport(g_gox + (int)((float)x * g_gs_x + .5f), g_goy + (int)((float)y * g_gs_y + .5f), (int)((float)w * g_gs_x + .5f), (int)((float)h * g_gs_y + .5f));
          }
          static void b_glScissor(int x, int y, int w, int h) {
            if (!r_glScissor) *(void **)&r_glScissor = h_gles ? dlsym(h_gles, "glScissor") : NULL;
            if (r_glScissor) r_glScissor(g_gox + (int)((float)x * g_gs_x + .5f), g_goy + (int)((float)y * g_gs_y + .5f), (int)((float)w * g_gs_x + .5f), (int)((float)h * g_gs_y + .5f));
          }
          static float to_gx(float wx) { return (wx - (float)g_gox) / g_gs_x; }
          static float to_gy(float wy) { return (wy - (float)g_goy) / g_gs_y; }

