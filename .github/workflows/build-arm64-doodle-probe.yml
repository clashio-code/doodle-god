            L("== selftest %s ==\n", ok ? "SEMUA LULUS" : "ADA YANG GAGAL");
            return ok ? 0 : 1;
          }

          /* ======================= main ======================= */
          int main(int argc, char **argv) {
            const char *dir = "libs";
            int stage = 0, timeout = 60, i, do_selftest = 0, frames = 600, sc = 1;
            Mod *cpp = NULL, *dg = NULL;
            struct sigaction sa;
            struct utsname u;
            stack_t ss0;

            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--selftest")) do_selftest = 1;
              else if (!strcmp(argv[i], "--stage") && i + 1 < argc) stage = pint(argv[++i]);
              else if (!strcmp(argv[i], "--timeout") && i + 1 < argc) timeout = pint(argv[++i]);
              else if (!strcmp(argv[i], "--frames") && i + 1 < argc) frames = pint(argv[++i]);
              else if (!strcmp(argv[i], "--sc") && i + 1 < argc) sc = pint(argv[++i]);
              else if (!strcmp(argv[i], "--resq") && i + 1 < argc) g_res_sync = pint(argv[++i]) == 0;
              else if (!strcmp(argv[i], "--splashack") && i + 1 < argc) { const char *z = argv[++i]; g_splash_delay = (*z == '-') ? -1 : pint(z); }
              else if (!strcmp(argv[i], "--apk") && i + 1 < argc) g_apk_arg = argv[++i];
              else if (!strcmp(argv[i], "--size") && i + 1 < argc) { const char *z = argv[++i]; g_gw = pint(z); while (*z >= '0' && *z <= '9') z++; g_gh = *z == 'x' ? pint(z + 1) : 0; }
              else if (!strcmp(argv[i], "--fit") && i + 1 < argc) g_fit_stretch = !strcmp(argv[++i], "stretch");
              else if (argv[i][0] != '-') dir = argv[i];
            }
            g_log = fopen("loader_log.txt", "w");
            L("== doodleloader (Milestone 3.5-splash) ==\n");
            if (uname(&u) == 0) L("device: %s %s %s | glibc %s\n", u.sysname, u.release, u.machine, gnu_get_libc_version());
            L("libs: %s | stage=%d timeout=%ds frames=%d sc=%d apk=%s\n", dir, stage, timeout, frames, sc, g_apk_arg);
          #if !defined(__aarch64__)
            L("(bukan aarch64: hanya stage 0 / selftest yang valid; kode game TIDAK akan dijalankan)\n");
            if (stage > 0) stage = 0;
          #endif

            memset(&sa, 0, sizeof sa);
            sa.sa_sigaction = on_sig; sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
            ss0.ss_sp = malloc(1u << 17); ss0.ss_size = 1u << 17; ss0.ss_flags = 0;
            if (ss0.ss_sp) sigaltstack(&ss0, NULL);
            sigaction(SIGSEGV, &sa, NULL); sigaction(SIGBUS, &sa, NULL); sigaction(SIGILL, &sa, NULL);
            sigaction(SIGFPE, &sa, NULL);  sigaction(SIGABRT, &sa, NULL);
            signal(SIGALRM, on_alarm);

            { char cwd[400]; if (getcwd(cwd, sizeof cwd)) snprintf(g_docpath, sizeof g_docpath, "%s/files/", cwd); else snprintf(g_docpath, sizeof g_docpath, "./files/"); }
            init_jni();
            if (do_selftest) return selftest();
            if (tls_guard_check() != 0 && stage > 0) { L("kanari TLS tidak cocok: kode game akan crash 'stack smashing'. Berhenti.\n"); return 1; }

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            h_gles = dlopen("libGLESv1_CM.so.1", RTLD_LAZY | RTLD_LOCAL);
            h_egl = dlopen("libEGL.so.1", RTLD_LAZY | RTLD_LOCAL);
            L("GLESv1_CM: %s | EGL: %s\n", h_gles ? "OK" : "TIDAK ADA", h_egl ? "OK" : "TIDAK ADA");

            if (load_mod(dir, "libc++_shared.so", &cpp) != 0) return 1;
            if (load_mod(dir, "libdoodle-everything.so", &dg) != 0) return 1;
            if (relocate(cpp) != 0) return 1;
            if (relocate(dg) != 0) return 1;
            protect(cpp); protect(dg);

            L("\n== ringkasan resolusi simbol (unik per modul) ==\n");
            L("modul sendiri=%d | modul lain (libc++)=%d | shim=%d | glibc=%d | GL/EGL=%d | weak->0=%d | TAK TERSELESAIKAN=%d\n", cnt_self, cnt_mod, cnt_shim, cnt_libc, cnt_gl, cnt_weak0, cnt_unres);
            for (i = 0; i < nunres; i++) L("  TAK TERSELESAIKAN: %s\n", unres_name[i]);
            { int k; L("  shim terpakai:"); for (k = 0; shim[k].name; k++) { int u2, hit = 0; for (u2 = 0; u2 < nmods; u2++) { int s; for (s = 1; s < mods[u2].nsym; s++) if (mods[u2].sym[s].st_shndx == SHN_UNDEF && mods[u2].sym[s].st_name && !strcmp(mods[u2].str + mods[u2].sym[s].st_name, shim[k].name)) hit = 1; } if (hit) L(" %s", shim[k].name); } L("\n"); }

            if (stage < 1) { L("\n== stage 0 selesai (tidak ada kode game yang dijalankan) ==\n"); return 0; }
            if (timeout > 0) alarm((unsigned)timeout);

            L("\n== konstruktor (stage 1) ==\n");
            run_init(cpp);
            run_init(dg);

            if (stage >= 2) {
              void *fn = mod_find(dg, "JNI_OnLoad");
              L("\n== JNI_OnLoad (stage 2) ==\n");
              if (!fn) { L("JNI_OnLoad tidak ada\n"); return 1; }
              L("JNI_OnLoad -> 0x%x\n", ((int (*)(void *, void *))fn)((void *)&g_vmobj, NULL));
            }
            if (stage >= 3) {
              int rc;
              mkdir("files", 0755);
              if (zlib_load() != 0 || apk_open(g_apk_arg) != 0) { L("Tidak bisa membuka APK '%s' (salin APK Doodle God ke folder game dan namai doodlegod.apk, atau pakai --apk). Berhenti.\n", g_apk_arg); return 1; }
              if (frames <= 0) alarm(0);
              rc = run_game(dg, frames, sc);
              print_java_summary();
              L("\n== Milestone 3 selesai (stage 3, rc=%d) ==\n", rc);
              fflush(NULL);
              _exit(rc);
            }
            if (stage >= 2) print_java_summary();
            L("\n== selesai (stage %d) ==\n", stage);
            fflush(NULL);
            _exit(0);   /* hindari destruktor atexit milik game */
          }
          EOF_C2
          cat > src/gen_stubs.py <<'EOF_PY'
          # Menghasilkan stubs.inc: nama slot JNI + 256 stub JNI + 64 stub simbol-tak-terselesaikan
          types = ["Object","Boolean","Byte","Char","Short","Int","Long","Float","Double","Void"]
          prims = ["Boolean","Byte","Char","Short","Int","Long","Float","Double"]
          n = {}
          for i in range(4): n[i] = "reserved%d" % i
          n[4]="GetVersion"; n[5]="DefineClass"; n[6]="FindClass"; n[7]="FromReflectedMethod"; n[8]="FromReflectedField"
          n[9]="ToReflectedMethod"; n[10]="GetSuperclass"; n[11]="IsAssignableFrom"; n[12]="ToReflectedField"
          n[13]="Throw"; n[14]="ThrowNew"; n[15]="ExceptionOccurred"; n[16]="ExceptionDescribe"; n[17]="ExceptionClear"
          n[18]="FatalError"; n[19]="PushLocalFrame"; n[20]="PopLocalFrame"; n[21]="NewGlobalRef"; n[22]="DeleteGlobalRef"
          n[23]="DeleteLocalRef"; n[24]="IsSameObject"; n[25]="NewLocalRef"; n[26]="EnsureLocalCapacity"
          n[27]="AllocObject"; n[28]="NewObject"; n[29]="NewObjectV"; n[30]="NewObjectA"
          n[31]="GetObjectClass"; n[32]="IsInstanceOf"; n[33]="GetMethodID"
          i = 34
          for t in types:
              for s in ("", "V", "A"): n[i] = "Call%sMethod%s" % (t, s); i += 1
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallNonvirtual%sMethod%s" % (t, s); i += 1
          assert i == 94
          n[94]="GetFieldID"; i = 95
          for t in types[:9]: n[i] = "Get%sField" % t; i += 1
          for t in types[:9]: n[i] = "Set%sField" % t; i += 1
          assert i == 113
          n[113]="GetStaticMethodID"; i = 114
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallStatic%sMethod%s" % (t, s); i += 1
          assert i == 144
          n[144]="GetStaticFieldID"; i = 145
          for t in types[:9]: n[i] = "GetStatic%sField" % t; i += 1
          for t in types[:9]: n[i] = "SetStatic%sField" % t; i += 1
          assert i == 163
          for k, nm in enumerate(["NewString","GetStringLength","GetStringChars","ReleaseStringChars","NewStringUTF",
                                  "GetStringUTFLength","GetStringUTFChars","ReleaseStringUTFChars","GetArrayLength",
                                  "NewObjectArray","GetObjectArrayElement","SetObjectArrayElement"]):
              n[163 + k] = nm
          i = 175
          for t in prims: n[i] = "New%sArray" % t; i += 1
          for t in prims: n[i] = "Get%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Release%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Get%sArrayRegion" % t; i += 1
          for t in prims: n[i] = "Set%sArrayRegion" % t; i += 1
          assert i == 215
          for k, nm in enumerate(["RegisterNatives","UnregisterNatives","MonitorEnter","MonitorExit","GetJavaVM",
                                  "GetStringRegion","GetStringUTFRegion","GetPrimitiveArrayCritical",
                                  "ReleasePrimitiveArrayCritical","GetStringCritical","ReleaseStringCritical",
                                  "NewWeakGlobalRef","DeleteWeakGlobalRef","ExceptionCheck","NewDirectByteBuffer",
                                  "GetDirectBufferAddress","GetDirectBufferCapacity","GetObjectRefType"]):
              n[215 + k] = nm
          assert n[215]=="RegisterNatives" and n[228]=="ExceptionCheck" and n[232]=="GetObjectRefType"
          assert n[33]=="GetMethodID" and n[113]=="GetStaticMethodID" and n[169]=="GetStringUTFChars" and n[167]=="NewStringUTF"
          assert n[61]=="CallVoidMethod" and n[141]=="CallStaticVoidMethod" and n[129]=="CallStaticIntMethod"
          o = []
          o.append("static const char *const jni_names[256] = {")
          for k in range(256):
              o.append('  "%s",' % n.get(k, "slot%d" % k))
          o.append("};")
          for k in range(256):
              o.append("static int jstub_%d(void) { return jni_trap(%d); }" % (k, k))
          o.append("static void *const jstubs[256] = {")
          o.append("  " + ", ".join("(void *)jstub_%d" % k for k in range(256)))
          o.append("};")
          for k in range(64):
              o.append("static int tstub_%d(void) { return trap_unres(%d); }" % (k, k))
          o.append("static void *const tstubs[64] = {")
          o.append("  " + ", ".join("(void *)tstub_%d" % k for k in range(64)))
          o.append("};")
          open("stubs.inc", "w").write("\n".join(o) + "\n")
          print("stubs.inc ok, nama terisi:", len(n))
          EOF_PY
          cat > out/DoodleProbe.sh <<'EOF_SH1'
          #!/bin/bash
          # Probe Doodle God HD (Milestone 1, arm64). Hanya membaca, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/doodle_god"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/doodle_god"

          cd "$GAMEDIR" || {
            echo "folder doodle_god tidak ketemu. Dicari di: /$directory/ports/doodle_god dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          chmod +x ./elfprobe64 2>/dev/null

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          uname -a >> probe_stdout.txt 2>&1
          if [ ! -f libs/libdoodle-everything.so ] || [ ! -f libs/libc++_shared.so ]; then
            echo "libs/libdoodle-everything.so dan libs/libc++_shared.so belum ada di $GAMEDIR/libs" > probe_report.txt
            sleep 3
            exit 1
          fi

          ./elfprobe64 libs/libdoodle-everything.so libs/libc++_shared.so probe_report.txt >> probe_stdout.txt 2>&1
          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH1
          cat > out/DoodleLoader.sh <<'EOF_SH2'
          #!/bin/bash
          # Doodle God HD loader (Milestone 3, arm64). Argumen dibaca dari loader.args, mis: --stage 3 --frames 600 --timeout 120
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/doodle_god"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/doodle_god"

          cd "$GAMEDIR" || {
            echo "folder doodle_god tidak ketemu. Dicari di: /$directory/ports/doodle_god dan di sebelah script ini." > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          chmod +x ./doodleloader 2>/dev/null

          if [ ! -f libs/libdoodle-everything.so ] || [ ! -f libs/libc++_shared.so ] || [ ! -f ./doodleloader ]; then
            echo "libs/libdoodle-everything.so, libs/libc++_shared.so atau doodleloader belum ada di $GAMEDIR" > loader_stdout.txt
            sleep 3
            exit 1
          fi

          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          # hapus log lama supaya tidak tertukar dengan hasil run ini
          rm -f loader_log.txt
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          echo "GAMEDIR=$GAMEDIR  args=$LOADER_ARGS" > loader_stdout.txt
          [ -f doodlegod.apk ] || echo "PERINGATAN: doodlegod.apk tidak ada di $GAMEDIR (dibutuhkan mulai --stage 3: salin APK Doodle God dan namai doodlegod.apk)" >> loader_stdout.txt
          ./doodleloader libs $LOADER_ARGS >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH2
          echo "--stage 3 --frames 700 --timeout 120 --sc 1" > out/doodle_god/loader.args
          echo "Taruh libdoodle-everything.so dan libc++_shared.so dari lib/arm64-v8a di APK Doodle God ke folder ini. Jangan di-upload ke GitHub." > out/doodle_god/libs/TARUH-LIB-DI-SINI.txt

      - name: Kompilasi (aarch64)
        run: |
          (cd src && python3 gen_stubs.py)
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o out/doodle_god/elfprobe64 src/elfprobe64.c -ldl
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Wno-format-truncation -Isrc -o out/doodle_god/doodleloader src/doodleloader.c -ldl -lpthread -lm
          file out/doodle_god/elfprobe64 out/doodle_god/doodleloader || true
          for B in elfprobe64 doodleloader; do
            echo "--- $B: library yang dibutuhkan:"
            aarch64-linux-gnu-readelf -d out/doodle_god/$B | grep NEEDED
            MAXV=$(aarch64-linux-gnu-readelf -V out/doodle_god/$B | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            echo "$B butuh GLIBC tertinggi: $MAXV (device: 2.37 atau lebih baru)"
            if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
              echo "GAGAL: $B butuh glibc lebih baru dari 2.37. Simbol penyebab:"
              aarch64-linux-gnu-nm -D --undefined-only out/doodle_god/$B | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
              exit 1
            fi
          done

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: doodle-probe-arm64
          path: out
