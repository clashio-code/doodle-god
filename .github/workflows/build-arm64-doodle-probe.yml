name: build-arm64-doodle-m2-dry
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Write M2 ELF dry-run parser and launcher
        shell: bash
        run: |
          set -eu
          mkdir -p out/doodle_god/libs src
          cat > src/elfdry64.c <<'EOF_C'
          /*
           * M2 Doodle God HD ELF dry-run inspector.
           * Parses ELF64/AArch64 program headers and PT_DYNAMIC metadata.
           * It DOES NOT mmap executable segments, relocate memory, call constructors,
           * call JNI_OnLoad, or execute any game code.
           */
          #define _FILE_OFFSET_BITS 64
          #include <elf.h>
          #include <errno.h>
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/types.h>

          #ifndef DT_RELR
          #define DT_RELR 36
          #define DT_RELRSZ 35
          #define DT_RELRENT 37
          #endif

          typedef struct {
            unsigned char *data;
            size_t size;
            Elf64_Ehdr *eh;
            Elf64_Phdr *ph;
            size_t phnum;
          } Image;

          static int range_ok(uint64_t off, uint64_t len, size_t size) {
            return off <= (uint64_t)size && len <= (uint64_t)size - off;
          }

          static void *at(Image *im, uint64_t off, uint64_t len) {
            if (!range_ok(off, len, im->size)) return NULL;
            return im->data + (size_t)off;
          }

          static uint64_t vaddr_to_offset(Image *im, uint64_t va, uint64_t len) {
            size_t i;
            for (i = 0; i < im->phnum; i++) {
              Elf64_Phdr *p = &im->ph[i];
              uint64_t delta;
              if (p->p_type != PT_LOAD || va < p->p_vaddr) continue;
              delta = va - p->p_vaddr;
              if (delta > p->p_filesz || len > p->p_filesz - delta) continue;
              if (!range_ok(p->p_offset + delta, len, im->size)) continue;
              return p->p_offset + delta;
            }
            return UINT64_MAX;
          }

          static void *vaddr_ptr(Image *im, uint64_t va, uint64_t len) {
            uint64_t off = vaddr_to_offset(im, va, len);
            if (off == UINT64_MAX) return NULL;
            return at(im, off, len);
          }

          static int load_image(const char *path, Image *im) {
            FILE *f;
            struct stat st;
            memset(im, 0, sizeof(*im));
            if (stat(path, &st) || st.st_size < (off_t)sizeof(Elf64_Ehdr)) {
              fprintf(stderr, "ERROR: cannot stat or file too small: %s\n", path);
              return -1;
            }
            im->size = (size_t)st.st_size;
            im->data = malloc(im->size);
            if (!im->data) { perror("malloc"); return -1; }
            f = fopen(path, "rb");
            if (!f) { perror(path); free(im->data); im->data = NULL; return -1; }
            if (fread(im->data, 1, im->size, f) != im->size) {
              fprintf(stderr, "ERROR: short read: %s\n", path);
              fclose(f); free(im->data); im->data = NULL; return -1;
            }
            fclose(f);
            im->eh = (Elf64_Ehdr *)im->data;
            if (memcmp(im->eh->e_ident, ELFMAG, SELFMAG) ||
                im->eh->e_ident[EI_CLASS] != ELFCLASS64 ||
                im->eh->e_ident[EI_DATA] != ELFDATA2LSB ||
                im->eh->e_machine != EM_AARCH64 ||
                (im->eh->e_type != ET_DYN && im->eh->e_type != ET_EXEC)) {
              fprintf(stderr, "ERROR: expected little-endian ELF64 AArch64 ET_DYN/ET_EXEC: %s\n", path);
              free(im->data); im->data = NULL; return -1;
            }
            if (im->eh->e_phentsize != sizeof(Elf64_Phdr) ||
                !range_ok(im->eh->e_phoff, (uint64_t)im->eh->e_phnum * sizeof(Elf64_Phdr), im->size)) {
              fprintf(stderr, "ERROR: invalid program-header table\n");
              free(im->data); im->data = NULL; return -1;
            }
            im->ph = (Elf64_Phdr *)(im->data + im->eh->e_phoff);
            im->phnum = im->eh->e_phnum;
            return 0;
          }

          static const char *relname(unsigned t) {
            switch (t) {
              case R_AARCH64_NONE: return "NONE";
              case R_AARCH64_ABS64: return "ABS64";
              case R_AARCH64_ABS32: return "ABS32";
              case R_AARCH64_PREL64: return "PREL64";
              case R_AARCH64_GLOB_DAT: return "GLOB_DAT";
              case R_AARCH64_JUMP_SLOT: return "JUMP_SLOT";
              case R_AARCH64_RELATIVE: return "RELATIVE";
              case R_AARCH64_TLS_DTPMOD: return "TLS_DTPMOD";
              case R_AARCH64_TLS_DTPREL: return "TLS_DTPREL";
              case R_AARCH64_TLS_TPREL: return "TLS_TPREL";
              case R_AARCH64_TLSDESC: return "TLSDESC";
              case R_AARCH64_IRELATIVE: return "IRELATIVE";
              default: return "OTHER";
            }
          }

          typedef struct {
            uint64_t rela, relasz, relaent;
            uint64_t rel, relsz, relent;
            uint64_t jmprel, pltrelsz, pltrel;
            uint64_t symtab, syment, strtab, strsz;
            uint64_t relr, relrsz, relrent;
            uint64_t android_rela, android_relasz, android_rel, android_relsz;
            uint64_t needed[128]; size_t nneeded;
            uint64_t soname;
            uint64_t init, init_array, init_arraysz;
            uint64_t pltgot, flags, flags1;
          } DynInfo;

          static void read_dynamic(Image *im, DynInfo *d) {
            size_t i;
            memset(d, 0, sizeof(*d));
            for (i = 0; i < im->phnum; i++) {
              Elf64_Phdr *p = &im->ph[i];
              if (p->p_type == PT_DYNAMIC) {
                Elf64_Dyn *dyn = (Elf64_Dyn *)at(im, p->p_offset, p->p_filesz);
                size_t n = (size_t)(p->p_filesz / sizeof(Elf64_Dyn)), j;
                if (!dyn) { puts("ERROR: PT_DYNAMIC points outside file"); return; }
                for (j = 0; j < n && dyn[j].d_tag != DT_NULL; j++) {
                  uint64_t v = dyn[j].d_un.d_val;
                  switch (dyn[j].d_tag) {
                    case DT_NEEDED: if (d->nneeded < 128) d->needed[d->nneeded++] = v; break;
                    case DT_SONAME: d->soname = v; break;
                    case DT_RELA: d->rela = v; break;
                    case DT_RELASZ: d->relasz = v; break;
                    case DT_RELAENT: d->relaent = v; break;
                    case DT_REL: d->rel = v; break;
                    case DT_RELSZ: d->relsz = v; break;
                    case DT_RELENT: d->relent = v; break;
                    case DT_JMPREL: d->jmprel = v; break;
                    case DT_PLTRELSZ: d->pltrelsz = v; break;
                    case DT_PLTREL: d->pltrel = v; break;
                    case DT_SYMTAB: d->symtab = v; break;
                    case DT_SYMENT: d->syment = v; break;
                    case DT_STRTAB: d->strtab = v; break;
                    case DT_STRSZ: d->strsz = v; break;
                    case DT_RELR: d->relr = v; break;
                    case DT_RELRSZ: d->relrsz = v; break;
                    case DT_RELRENT: d->relrent = v; break;
                    case DT_INIT: d->init = v; break;
                    case DT_INIT_ARRAY: d->init_array = v; break;
                    case DT_INIT_ARRAYSZ: d->init_arraysz = v; break;
                    case DT_PLTGOT: d->pltgot = v; break;
                    case DT_FLAGS: d->flags = v; break;
                    case DT_FLAGS_1: d->flags1 = v; break;
                    default:
                      /* Android packed relocation tags commonly used by bionic. */
                      if ((uint64_t)dyn[j].d_tag == 0x6000000f) d->android_rela = v;
                      if ((uint64_t)dyn[j].d_tag == 0x60000010) d->android_relasz = v;
                      if ((uint64_t)dyn[j].d_tag == 0x60000011) d->android_rel = v;
                      if ((uint64_t)dyn[j].d_tag == 0x60000012) d->android_relsz = v;
                      break;
                  }
                }
              }
            }
          }

          static const char *dynstr(Image *im, DynInfo *d, uint64_t off) {
            char *s;
            if (!d->strtab || off >= d->strsz) return "(bad-dynstr-offset)";
            s = (char *)vaddr_ptr(im, d->strtab + off, d->strsz - off);
            if (!s) return "(dynstr-not-file-backed)";
            if (!memchr(s, 0, (size_t)(d->strsz - off))) return "(unterminated-dynstr)";
            return s;
          }

          static void count_rela(Image *im, DynInfo *d, uint64_t va, uint64_t bytes, const char *label) {
            Elf64_Rela *r;
            uint64_t off, n, i, counts[2048] = {0};
            if (!va || !bytes) { printf("  %-12s: none\n", label); return; }
            if (d->relaent != sizeof(Elf64_Rela)) {
              printf("  %-12s: unsupported/invalid RELA entry size=%" PRIu64 "\n", label, d->relaent);
              return;
            }
            off = vaddr_to_offset(im, va, bytes);
            if (off == UINT64_MAX) { printf("  %-12s: table not file-backed / invalid range\n", label); return; }
            n = bytes / sizeof(Elf64_Rela);
            r = (Elf64_Rela *)(im->data + off);
            for (i = 0; i < n; i++) {
              unsigned t = (unsigned)ELF64_R_TYPE(r[i].r_info);
              if (t < 2048) counts[t]++;
            }
            printf("  %-12s: VA=0x%" PRIx64 " bytes=%" PRIu64 " entries=%" PRIu64 "\n", label, va, bytes, n);
            for (i = 0; i < 2048; i++) if (counts[i])
              printf("      %-16s (%" PRIu64 ") : %" PRIu64 "\n", relname((unsigned)i), i, counts[i]);
          }

          static void report(const char *path) {
            Image im;
            DynInfo d;
            size_t i;
            unsigned loads = 0, tls = 0;
            uint64_t maxalign = 0, minva = UINT64_MAX, maxva = 0;
            if (load_image(path, &im)) exit(1);
            printf("== M2 ELF dry-run: %s ==\n", path);
            printf("File bytes: %zu | ELF type=%u | machine=%u | entry=0x%" PRIx64 "\n",
                   im.size, im.eh->e_type, im.eh->e_machine, (uint64_t)im.eh->e_entry);
            for (i = 0; i < im.phnum; i++) {
              Elf64_Phdr *p = &im.ph[i];
              if (p->p_type == PT_LOAD) {
                loads++;
                if (p->p_align > maxalign) maxalign = p->p_align;
                if (p->p_vaddr < minva) minva = p->p_vaddr;
                if (p->p_vaddr + p->p_memsz > maxva) maxva = p->p_vaddr + p->p_memsz;
                printf("PT_LOAD[%zu]: off=0x%" PRIx64 " VA=0x%" PRIx64 " filesz=0x%" PRIx64
                       " memsz=0x%" PRIx64 " align=0x%" PRIx64 " flags=%c%c%c\n",
                       i, p->p_offset, p->p_vaddr, p->p_filesz, p->p_memsz, p->p_align,
                       (p->p_flags & PF_R) ? 'R' : '-', (p->p_flags & PF_W) ? 'W' : '-',
                       (p->p_flags & PF_X) ? 'X' : '-');
              } else if (p->p_type == PT_TLS) {
                tls++;
                printf("PT_TLS[%zu]: VA=0x%" PRIx64 " filesz=0x%" PRIx64 " memsz=0x%" PRIx64 " align=0x%" PRIx64 "\n",
                       i, p->p_vaddr, p->p_filesz, p->p_memsz, p->p_align);
              } else if (p->p_type == PT_DYNAMIC) {
                printf("PT_DYNAMIC[%zu]: off=0x%" PRIx64 " bytes=0x%" PRIx64 "\n", i, p->p_offset, p->p_filesz);
              }
            }
            printf("Segments: PT_LOAD=%u max_align=0x%" PRIx64 " PT_TLS=%u"
                   " | image VA range=[0x%" PRIx64 ",0x%" PRIx64 ")\n",
                   loads, maxalign, tls, minva, maxva);
            read_dynamic(&im, &d);
            puts("\n-- DT_NEEDED / dynamic tags --");
            for (i = 0; i < d.nneeded; i++) printf("DT_NEEDED: %s\n", dynstr(&im, &d, d.needed[i]));
            if (d.soname) printf("DT_SONAME: %s\n", dynstr(&im, &d, d.soname));
            printf("DT_SYMTAB=0x%" PRIx64 " DT_SYMENT=%" PRIu64 " DT_STRTAB=0x%" PRIx64 " DT_STRSZ=%" PRIu64 "\n",
                   d.symtab, d.syment, d.strtab, d.strsz);
            printf("DT_PLTGOT=0x%" PRIx64 " DT_FLAGS=0x%" PRIx64 " DT_FLAGS_1=0x%" PRIx64 "\n",
                   d.pltgot, d.flags, d.flags1);
            if (d.init) printf("DT_INIT present at VA 0x%" PRIx64 " (NOT called)\n", d.init);
            if (d.init_array) printf("DT_INIT_ARRAY present at VA 0x%" PRIx64 " bytes=%" PRIu64 " (NOT called)\n", d.init_array, d.init_arraysz);
            puts("\n-- Relocation tables (inspection only; no relocation writes) --");
            count_rela(&im, &d, d.rela, d.relasz, "DT_RELA");
            if (d.jmprel && d.pltrelsz && d.pltrel == DT_RELA)
              count_rela(&im, &d, d.jmprel, d.pltrelsz, "DT_JMPREL");
            else if (d.jmprel && d.pltrelsz)
              printf("  DT_JMPREL: present but PLTREL=%" PRIu64 " (not RELA; inspect separately)\n", d.pltrel);
            if (d.rel && d.relsz)
              printf("  DT_REL: present VA=0x%" PRIx64 " bytes=%" PRIu64 " (REL parser not enabled in this build)\n", d.rel, d.relsz);
            if (d.relr && d.relrsz)
              printf("  DT_RELR: present VA=0x%" PRIx64 " bytes=%" PRIu64 " entry=%" PRIu64 " (RELR decoder not enabled)\n", d.relr, d.relrsz, d.relrent);
            if (d.android_rela || d.android_relasz || d.android_rel || d.android_relsz)
              printf("  Android packed relocation tags found (APS2): RELA=0x%" PRIx64 "/%" PRIu64 " REL=0x%" PRIx64 "/%" PRIu64 " (decoder not enabled)\n",
                     d.android_rela, d.android_relasz, d.android_rel, d.android_relsz);
            puts("\nSAFETY: dry-run only. No executable mapping, relocation writes, constructors, JNI_OnLoad, or game code ran.");
            free(im.data);
          }

          int main(int argc, char **argv) {
            int i;
            if (argc < 2) {
              fprintf(stderr, "Usage: %s lib-or-elf.so [another.so ...]\n", argv[0]);
              return 2;
            }
            for (i = 1; i < argc; i++) report(argv[i]);
            return 0;
          }
          EOF_C

          cat > out/DoodleM2.sh <<'EOF_SH'
          #!/bin/bash
          # M2: static ELF dry-run only; never runs the Android game library.
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi
          if [ -f "$controlfolder/control.txt" ]; then
            source "$controlfolder/control.txt"
            [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
          fi
          SELF="$(cd "$(dirname "$0")" && pwd)"
          GAMEDIR="/${directory:-roms}/ports/doodle_god"
          [ -d "$GAMEDIR" ] || GAMEDIR="$SELF/doodle_god"
          mkdir -p "$GAMEDIR"
          cd "$GAMEDIR" || exit 1
          chmod +x "$SELF/elfdry64" 2>/dev/null
          {
            echo "== Doodle God HD M2 dry-run =="
            uname -a
            echo "GAMEDIR=$GAMEDIR"
          } > "$GAMEDIR/m2_stdout.txt"
          : > "$GAMEDIR/m2_report.txt"
          if [ ! -f "$GAMEDIR/libs/libdoodle-everything.so" ]; then
            echo "Missing libs/libdoodle-everything.so in $GAMEDIR" | tee -a "$GAMEDIR/m2_report.txt" >> "$GAMEDIR/m2_stdout.txt"
            sleep 3
            exit 1
          fi
          "$SELF/elfdry64" "$GAMEDIR/libs/libdoodle-everything.so" "$GAMEDIR/libs/libc++_shared.so" \
            > "$GAMEDIR/m2_report.txt" 2>&1
          rc=$?
          echo "exit code: $rc" >> "$GAMEDIR/m2_stdout.txt"
          cat "$GAMEDIR/m2_report.txt" >> "$GAMEDIR/m2_stdout.txt"
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          exit "$rc"
          EOF_SH
          chmod +x out/DoodleM2.sh
          echo "Copy private APK libs here: libdoodle-everything.so and libc++_shared.so. Do not commit these files." > out/doodle_god/libs/KEEP_PRIVATE_LIBS_HERE.txt

      - name: Compile for Linux AArch64
        shell: bash
        run: |
          set -eu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -o out/elfdry64 src/elfdry64.c
          file out/elfdry64
          aarch64-linux-gnu-readelf -d out/elfdry64 | grep NEEDED
          MAXV=$(aarch64-linux-gnu-readelf -V out/elfdry64 | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "elfdry64 highest GLIBC requirement: ${MAXV:-unknown} (target device: 2.37)"
          if [ -n "${MAXV:-}" ] && [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "ERROR: binary requires glibc newer than 2.37"
            exit 1
          fi

      - name: Upload M2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodle-m2-dry-arm64
          path: out/
