          /* semua panggilan native -> Java lewat sini: di-log lengkap dengan argumen; nilai balik default (0 / string kosong) */
          static void java_invoke(void *mid, const jv *a, jv *r) {
            MInfo *m = mi_get(mid);
            const char *rp;
            char rt, args[400];
            memset(r, 0, sizeof *r);
            if (!m) { L("[Java] methodID tak dikenal: %p\n", mid); return; }
            rp = strchr(m->sig, ')');
            rt = rp ? rp[1] : 'V';
            m->count++;
            fmt_args(m, a, args, sizeof args);
            if (jlog_budget > 0 || m->count <= 3) { L("[Java] %s.%s(%s) -> %c\n", m->cls, m->name, args, rt); if (jlog_budget > 0) jlog_budget--; }
            if (rt == 'L' && rp) {
              char cn[128];
              const char *q = rp + 2;
              size_t k = 0;
              while (*q && *q != ';' && k < sizeof cn - 1) cn[k++] = *q++;
              cn[k] = 0;
              if (!strcmp(cn, "java/lang/String")) r->l = mk_handle(jstr_value(m, a));
              else r->l = mk_obj(cn);   /* objek palsu baru (mis. getAssets() -> AssetManager) agar native tidak menerima NULL */
            } else if (rt == '[' && rp && rp[2] == 'I') {
              int idx = (int)(m - minfo);   /* int[] (getSafeArea / getBannerSize / getMrecSize): satu array nol per metode */
              if (idx >= 0 && idx < 512) {
                if (!g_retarr[idx]) g_retarr[idx] = mk_array(4, !strcmp(m->name, "getSafeArea") ? 4 : 2);
                r->l = g_retarr[idx];
              }
            } else if (rt == 'Z' || rt == 'I' || rt == 'B' || rt == 'C' || rt == 'S' || rt == 'J') {
              const char *ov = jov_get(m->name);
              if (ov) { if (rt == 'J') r->j = jparse(ov); else r->i = (int)jparse(ov); }
              else if (rt == 'Z') r->i = jbool_value(m, a);
                else if (rt == 'I' && !strcmp(m->name, "hashCode") && strstr(m->cls, "Signature")) { sig_init(); r->i = g_sig_hash; }
            }
            if (rt == 'V' && !strcmp(m->name, "checkLicensing")) g_lic_pending = 1;
            if (rt == 'V' && !strcmp(m->name, "showSplash") && g_splash_delay >= 0) { g_splash_val = a[0].i & 0xff; g_splash_pending = g_splash_delay + 1; }
            if (rt == 'V' && !strcmp(m->name, "loadResource")) {
              if (g_res_sync) res_deliver_one(h2s(a[0].l), a[1].j);
              else if (g_resq_n < 128) { snprintf(g_resq[g_resq_n].path, sizeof g_resq[0].path, "%s", h2s(a[0].l)); g_resq[g_resq_n].ptr = a[1].j; g_resq_n++; }
              else L("[res] antrean penuh, loadResource dibuang\n");
            }
          }

