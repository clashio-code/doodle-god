          /* path dari game -> path di disk: absolut dipakai apa adanya, relatif di bawah folder files/ */
          static void host_path(const char *p, char *out, size_t sz) {
            if (p[0] == '/') snprintf(out, sz, "%s", p); else snprintf(out, sz, "%s%s", g_docpath, p);
          }
          static void mkdir_p(const char *path) {
            char t[700]; size_t i;
            snprintf(t, sizeof t, "%s", path);
            for (i = 1; t[i]; i++) if (t[i] == '/') { t[i] = 0; mkdir(t, 0755); t[i] = '/'; }
            mkdir(t, 0755);
          }

          /* listDir/getDirList -> CSV "nama,d" (folder) atau "nama,f" (file); native mem-parse dengan CSVParser(',', '"') dan cek huruf pertama kolom 2 == 'd'.
           * Sumber: aset di APK (assets/<path>/), kalau kosong baru folder di disk. */
          static const char *dir_csv(const char *path, char *out, size_t sz) {
            char pre[600], dirs[256][96], p[700];
            size_t o = 0, pl;
            int i, nd = 0, nfound = 0;
            const char *q = path;
            while (*q == '/') q++;
            snprintf(pre, sizeof pre, "assets/%s", q);
            pl = strlen(pre);
            while (pl > 7 && pre[pl - 1] == '/') pre[--pl] = 0;
            if (pl > 6) { pre[pl++] = '/'; pre[pl] = 0; }
            out[0] = 0;
            for (i = 0; i < g_nents; i++) {
              const char *nm = g_ents[i].name, *rest, *sl;
              char comp[96];
              size_t cl;
              int isdir, k, dup = 0;
              if (strncmp(nm, pre, pl) != 0) continue;
              rest = nm + pl;
              if (!*rest) continue;
              sl = strchr(rest, '/');
              cl = sl ? (size_t)(sl - rest) : strlen(rest);
              if (cl == 0 || cl >= sizeof comp) continue;
              memcpy(comp, rest, cl); comp[cl] = 0;
              isdir = sl != NULL;
              if (isdir) {
                for (k = 0; k < nd; k++) if (!strcmp(dirs[k], comp)) { dup = 1; break; }
                if (dup) continue;
                if (nd < 256) snprintf(dirs[nd++], sizeof dirs[0], "%s", comp);
              }
              if (o + cl + 8 >= sz) break;
              o += (size_t)snprintf(out + o, sz - o, "%s,%c\n", comp, isdir ? 'd' : 'f');
              nfound++;
            }
            if (!nfound) {
              DIR *d;
              struct dirent *e;
              host_path(path, p, sizeof p);
              d = opendir(p);
              if (d) {
                while ((e = readdir(d)) != NULL) {
                  struct stat st; char fp[900];
                  if (!strcmp(e->d_name, ".") || !strcmp(e->d_name, "..")) continue;
                  snprintf(fp, sizeof fp, "%s/%s", p, e->d_name);
                  if (o + strlen(e->d_name) + 8 >= sz) break;
                  o += (size_t)snprintf(out + o, sz - o, "%s,%c\n", e->d_name, (stat(fp, &st) == 0 && S_ISDIR(st.st_mode)) ? 'd' : 'f');
                  nfound++;
                }
                closedir(d);
              }
            }
            if (g_dirlog++ < 20) L("[java] listDir(\"%s\") -> %d entri (prefix APK \"%s\"): %.300s\n", path, nfound, pre, out);
            return out;
          }

          static const char *jstr_value(const MInfo *m, const jv *a) {
            static char buf[65536];
            const char *v = jov_get(m->name), *s;
            size_t i;
            if (v) return v;
            if (!strcmp(m->name, "docPath")) return g_docpath;
            if (!strcmp(m->name, "toUpperUTF8") || !strcmp(m->name, "toLowerUTF8")) {
              int up = m->name[2] == 'U';
              s = h2s(a[0].l);
              for (i = 0; s[i] && i < sizeof buf - 1; i++) buf[i] = (char)(up ? toupper((unsigned char)s[i]) : tolower((unsigned char)s[i]));
              buf[i] = 0;
              return buf;
            }
            if (!strcmp(m->name, "getDirList")) return dir_csv(h2s(a[0].l), buf, sizeof buf);   /* AndroidDevice::getDirList mem-parse CSV */
          if (!strcmp(m->name, "listDir")) {   /* ofxDirList::listDir mem-parse hasilnya sebagai JSON: ["nama1","nama2"] (Json::get + asString) */
            static char csv[65536];
            static int jlog;
            const char *c = dir_csv(h2s(a[0].l), csv, sizeof csv), *e;
            size_t o = 0;
            buf[o++] = '[';
            while (*c && o + 300 < sizeof buf) {
              e = strchr(c, ',');
              if (!e) break;
              if (e > c) {
                if (o > 1) buf[o++] = ',';
                o += (size_t)snprintf(buf + o, sizeof buf - o, "\"%.*s\"", (int)(e - c), c);
              }
              c = strchr(e, '\n');
              if (!c) break;
              c++;
            }
            buf[o++] = ']'; buf[o] = 0;
            if (jlog++ < 20) L("[java] listDir JSON: %.200s\n", buf);
            return buf;
          }
            if (!strcmp(m->name, "getResourceString") || !strcmp(m->name, "getResourceValue")) {
              const char *r = res_string(h2s(a[0].l));
              if (r) return r;
              if (strstr(m->sig, "(Ljava/lang/String;Ljava/lang/String;)")) return h2s(a[1].l);   /* overload dengan nilai bawaan */
              return "";
            }
            return jstr_default(m->name);
          }

          static int jbool_value(const MInfo *m, const jv *a) {
            char p[700];
            if (!strcmp(m->name, "isFileExists")) {
              struct stat st; const char *q = h2s(a[0].l); char full[700];
              host_path(q, p, sizeof p);
              if (stat(p, &st) == 0) return 1;
              while (*q == '/') q++;
              snprintf(full, sizeof full, "assets/%s", q);
              return apk_find(full) != NULL;
            }
            if (!strcmp(m->name, "createDirectory")) { host_path(h2s(a[0].l), p, sizeof p); mkdir_p(p); return 1; }
            if (!strcmp(m->name, "deleteFile")) { host_path(h2s(a[0].l), p, sizeof p); unlink(p); return 1; }
            if (!strcmp(m->name, "getResourceBoolean")) return res_bool(h2s(a[0].l), strstr(m->sig, ";Z)Z") ? a[1].i : 0);
            if (!strcmp(m->name, "isAppInstalled")) return !strcmp(h2s(a[0].l), "com.android.vending");   /* cek Play Store terpasang */
            if (!strcmp(m->name, "isTablet")) return 1;            /* platform = ANDROID_TABLET */
            if (!strcmp(m->name, "isPlayPassVersion")) return 1;   /* bool/play_pass_version = true */
            return 0;
          }

