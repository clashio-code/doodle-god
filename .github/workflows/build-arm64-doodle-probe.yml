          /* gamepad -> sentuhan: stick kiri/D-pad = kursor, A = ketuk/tahan, B = Back, Select+Start = keluar. Mouse/jari layar sentuh juga diteruskan. */
          static void pump_events(void) {
            unsigned char ev[64] __attribute__((aligned(8)));
            float spd = 10.f, dx, dy;
            while (p_SDL_PollEvent(ev)) {
              uint32_t t = *(uint32_t *)ev;
              if (t == 0x100) g_quit = 1;                                   /* SDL_QUIT */
              else if (t == 0x653 && p_SDL_GameControllerOpen) p_SDL_GameControllerOpen(*(int32_t *)(ev + 8));   /* CONTROLLERDEVICEADDED */
              else if (t == 0x651 || t == 0x652) {                           /* CONTROLLERBUTTONDOWN / UP */
                int down = (t == 0x651), b = ev[12];
                if (b == 0) { if (down) tap_down(g_cx, g_cy); else tap_up(g_cx, g_cy); }
                else if (b == 1 && down && nf_backPressed) { int r = (uint8_t)nf_backPressed(g_nenv, g_ncls); L("[input] backPressed -> %d\n", r); }
                else if (b == 4) g_btn_back = down;
                else if (b == 6) g_btn_start = down;
                else if (b >= 11 && b <= 14) g_dp[b - 11] = down;
                if (g_btn_back && g_btn_start) g_quit = 1;
              } else if (t == 0x650) {                                       /* CONTROLLERAXISMOTION */
                float v = (float)(*(int16_t *)(ev + 16)) / 32768.f;
                if (v > -0.2f && v < 0.2f) v = 0.f;
                if (ev[12] == 0) g_ax = v; else if (ev[12] == 1) g_ay = v;
              } else if (t == 0x401) { g_cx = to_gx((float)*(int32_t *)(ev + 20)); g_cy = to_gy((float)*(int32_t *)(ev + 24)); tap_down(g_cx, g_cy); }    /* MOUSEBUTTONDOWN */
              else if (t == 0x402) tap_up(to_gx((float)*(int32_t *)(ev + 20)), to_gy((float)*(int32_t *)(ev + 24)));
              else if (t == 0x400 && g_touch_down && (*(uint32_t *)(ev + 16) & 1)) { g_cx = to_gx((float)*(int32_t *)(ev + 20)); g_cy = to_gy((float)*(int32_t *)(ev + 24)); if (nf_touchMoved) nf_touchMoved(g_nenv, g_ncls, 0, g_cx, g_cy); }
              else if (t == 0x700) { g_cx = to_gx(*(float *)(ev + 24) * (float)g_ww); g_cy = to_gy(*(float *)(ev + 28) * (float)g_wh); tap_down(g_cx, g_cy); }   /* FINGERDOWN */
              else if (t == 0x701) tap_up(to_gx(*(float *)(ev + 24) * (float)g_ww), to_gy(*(float *)(ev + 28) * (float)g_wh));
              else if (t == 0x702 && g_touch_down && nf_touchMoved) { g_cx = to_gx(*(float *)(ev + 24) * (float)g_ww); g_cy = to_gy(*(float *)(ev + 28) * (float)g_wh); nf_touchMoved(g_nenv, g_ncls, 0, g_cx, g_cy); }
            }
            dx = g_ax + (float)(g_dp[3] - g_dp[2]); dy = g_ay + (float)(g_dp[1] - g_dp[0]);
            if (dx != 0.f || dy != 0.f) {
              g_cx += dx * spd; g_cy += dy * spd;
              if (g_cx < 0.f) g_cx = 0.f;
              if (g_cx > (float)g_sw) g_cx = (float)g_sw;
              if (g_cy < 0.f) g_cy = 0.f;
              if (g_cy > (float)g_sh) g_cy = (float)g_sh;
              if (g_touch_down && nf_touchMoved) nf_touchMoved(g_nenv, g_ncls, 0, g_cx, g_cy);
            }
          }

