          /* satu permintaan loadResource, persis logika Java: path "/x" -> "x"; ekstensi json -> dibaca "x.json.amr"; baca aset APK (atau disk);
           * kalau gagal Java mengirim byte[0]; lalu GameService.loadResourceCallback(ptr, byte[], len) */
          static void res_deliver_one(const char *path, int64_t ptr) {
            static nf_rescb_t cb;
            static int looked;
            unsigned char *buf = NULL;
            long n = 0;
            void *arr;
            char norm[700], full[760], hp[700];
            ZEnt *e;
            if (!looked && g_dgmod) {
              looked = 1;
              cb = (nf_rescb_t)mod_find(g_dgmod, "Java_com_joybits_doodleeverything_GameService_loadResourceCallback");
              if (!cb) L("[res] loadResourceCallback TIDAK ADA\n");
            }
            if (!cb) return;
            res_norm_path(path, norm, sizeof norm);
            snprintf(full, sizeof full, "assets/%s", norm);
            e = apk_find(full);
            if (e) buf = apk_read(e, &n);
            if (!buf) {
              FILE *f; host_path(path, hp, sizeof hp);
              f = fopen(hp, "rb");
              if (f) {
                long sz; fseek(f, 0, SEEK_END); sz = ftell(f); fseek(f, 0, SEEK_SET);
                if (sz >= 0) { buf = malloc((size_t)sz + 1); if (buf && fread(buf, 1, (size_t)sz, f) == (size_t)sz) n = sz; else { free(buf); buf = NULL; } }
                fclose(f);
              }
            }
            if (buf) { if (g_asset_ok++ < 150) L("[res] %s -> %s (%ld byte)\n", path, full, n); }
            else {
              n = 0;
              if (g_asset_miss++ < 100) {
                L("[res] %s -> TIDAK ADA (APK maupun disk), kirim byte[0] seperti Java | dicari: %s\n", path, full);
                if (e) L("[res] entri ada di APK tapi apk_read gagal: method=%u csize=%u usize=%u loff=%u\n", e->method, e->csize, e->usize, e->loff);
              }
            }
            arr = mk_array(1, (int)n);
            if (arr && buf && n > 0) memcpy(arr_get(arr)->data, buf, (size_t)n);
            free(buf);
            cb(g_nenv, mk_handle("com/joybits/doodleeverything/GameService"), ptr, arr, (int)n);
            arr_free(arr);
          }

